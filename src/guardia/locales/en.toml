[scan]
title = "MCP configuration analysis"
scope_note = "This analysis checks configurations: commands, arguments, variables and addresses. Tool descriptions, code and dependencies come in the next steps."
summary = "Summary: {servers} servers analyzed, {findings} problems found."
where = "Where"
