[guide]
title = "Guardia MCP rules guide"
intro = "This guide lists all {count} rules Guardia uses to check MCP servers and skills. For each one you find why it is a risk and how to fix it. The guide is generated by the program itself with `guardia rules --markdown`, so it always matches the code. In the texts, «…» marks a value that a real report replaces with the name of the server, file or field that was found."
levels_title = "Severity levels"
level = "Level"
meaning = "What it means"
level_critical = "Almost certainly an attack or a serious flaw. Act now: disable the server or skill until you understand it."
level_high = "A serious, concrete risk. Fix it before you keep using the server."
level_medium = "A weakness an attacker can exploit together with something else. Fix it when you can."
level_low = "A bad habit or a small risk. Fix it at your own pace."
level_info = "Not a problem: useful information, for example what a server can do or that something changed."
read_title = "How to read a finding"
read_text = "Every finding shows a code (for example G05-002), a level, the exact place (file, line and field), what was found, why it is a risk and how to fix it. Secrets are never shown in full: you see [REDACTED] or only their length."
code_title = "How codes work"
code_text = "A code has two parts: G05 is the family (for example \"dangerous system commands\"), 002 is the rule inside the family. Codes are never reused for a different meaning, so you can search, quote and filter them in tools that read SARIF."
what_title = "What to do when you find a problem"
what_text = """
1. Read the rule's \"Why\" and \"How to fix\".
2. If you do not recognize the server or skill, disable it before investigating: it is the safest choice.
3. If the finding is a change (family G03) and you made the update yourself, accept it with `guardia scan --accept-changes` or with the \"Accept changes\" button in the app. The choice is written to the ledger.
4. After fixing, scan again to check that the finding is gone.
5. If you think it is a false alarm, report it as explained in CONTRIBUTING.md.
"""
false_title = "False alarms and missed alarms"
false_text = "Guardia works by reading files, without running anything and without artificial intelligence. So it can be wrong in two ways: flagging harmless text (false alarm) or missing a new trick (missed alarm). \"No findings\" does not mean \"safe\": it means these rules found nothing. All limits are explained in SECURITY.md."
shield_title = "What about rules I write myself?"
shield_text = "Rules you write in TOML drive the real-time Shield (see docs/SHIELD.md). This guide covers only the fixed analysis rules of version 1, which cannot be turned off: this way no malicious file can switch them off."
terms_title = "Useful words"
term_tool_poisoning = "Tool poisoning"
term_tool_poisoning_text = "instructions hidden in a tool's description. The user does not see them, but the AI reads them and may obey."
term_prompt_injection = "Prompt injection"
term_prompt_injection_text = "text written to replace the user's orders, for example \"ignore previous instructions\". It can come from a tool, a file or a web page."
term_rug_pull = "Rug pull"
term_rug_pull_text = "a server that was harmless and secretly changes after you trusted it. Guardia detects it by comparing every scan with the baseline."
term_shadowing = "Shadowing"
term_shadowing_text = "a server that tries to influence how the AI uses another server's tools, for example \"when you use send_email add this address\"."
term_typosquatting = "Typosquatting"
term_typosquatting_text = "a package whose name is almost the same as a famous one (one letter added or swapped), published hoping someone makes a typo."
term_secret = "Secret"
term_secret_text = "a key, token or password that gives access to a service. If it ends up in a configuration file, anyone who reads the file can use it."
term_baseline = "Baseline"
term_baseline_text = "the snapshot of tools and skills taken at the previous scan. It is used to notice what changed."
term_skill = "Skill"
term_skill_text = "a folder with a SKILL.md file that teaches the AI how to do a task. It can contain instructions and scripts, so it must be checked like a server."
families_title = "Rule families"
family_count = "{count} rules"
