why = "Why"
fix = "How to fix"
clean = "No problems found in {count} servers: {names}"
not_safe = "\"No problems found\" does not mean \"safe\": it means these rules found nothing."
incomplete = "WARNING: incomplete analysis, {count} parts could not be analyzed (for example an unreadable configuration file). The results do not cover everything."
file_problems = "Problems in configuration files"
no_servers = "No MCP servers to analyze."
no_version = "none"
scope_note_tools = "This analysis checks configurations, tools, descriptions, schemas, code and dependencies read from files, without running anything."
tool_field = "tool \"{tool}\", field {field}"
tool_only = "tool \"{tool}\""
tools_found = "Tools analyzed: {count} (source: {origins})"
tools_skipped = "Tools not analyzed (--no-tools option)."
capabilities = "the code can: {names}"
coverage = "Coverage: {tools} tools read from {servers} distinct servers."
coverage_gaps = "Not analyzable without running them: {parts}. For remote servers you can provide a JSON export with --path."
coverage_gaps_app = "Not analyzable without running them: {parts}. This is expected: Guardia never starts servers to check them."

[rules.G01-001]
title = "Invisible characters in the configuration"
why = "The field \"{field}\" contains characters that are not visible on screen ({codes}). This is a known trick to make text look harmless while it says something else to the AI or to the program."
fix = "Open the file with an editor that shows invisible characters and retype the value by hand. If you do not know where this configuration comes from, remove the server."

[rules.G05-001]
title = "Started through a shell with chained commands"
why = "The server is started with {program} and a command that chains several operations (for example with &&, | or ;). Other commands you do not see may run besides the server."
fix = "Start the server program directly (for example \"command\": \"npx\") without a shell, or reduce the command to a single clear operation."

[rules.G05-002]
title = "Encoded PowerShell command"
why = "The server starts {program} with a base64-encoded command. Its content cannot be read at a glance: this is a typical malware trick to hide what runs."
fix = "Do not use this server until you have decoded and understood the command. If you did not write it, remove it."

[rules.G05-003]
title = "Windows program often abused"
why = "The server uses {program}, a legitimate Windows program often abused by attackers to download or run code covertly."
fix = "A normal MCP server does not need {program}. Check where the configuration comes from and replace it with the server's official command."

[rules.G05-004]
title = "Downloads and runs code from the Internet"
why = "The start command downloads something from the Internet and runs it immediately, without checks. Whoever controls that address can run anything on your PC every time the server starts."
fix = "Remove this configuration. Install the server from an official source with an exact version."

[rules.G05-005]
title = "Destructive or system-changing command"
why = "The start command contains a dangerous operation (\"{pattern}\"): it can delete data, change security settings or gain elevated privileges."
fix = "Remove the operation from the start command. An MCP server must not change the system when it starts."

[rules.G05-006]
title = "Program started from a temporary or Downloads folder"
why = "The server program lives in a temporary or Downloads folder, where unverified downloads usually end up."
fix = "Install the server in a stable folder, or through a package manager, and update the path."

[rules.G05-007]
title = "Code hidden in the arguments"
why = "The server starts {program} and passes code to execute directly in the arguments. This code is not in any file you can review and can do anything."
fix = "Move the code into a file you can read and verify, or use the server's official package."

[rules.G06-001]
title = "Secret key written in plain text"
why = "The variable \"{name}\" contains a secret value ({length} characters) written directly in the file. Any program that reads this file, including a malicious MCP server, can copy it."
fix = "Replace the value with a reference to an environment variable (in Claude Code for example \"${{{name}}}\") or use the app's credential manager. Then rotate the key: consider it exposed."

[rules.G06-002]
title = "Secret in the command arguments"
why = "A start argument contains what looks like a secret ({value}). Arguments are visible to every program on the PC, for example in Task Manager."
fix = "Pass the secret through an environment variable, not as an argument. Then rotate the secret."

[rules.G06-003]
title = "Plain-text secret in HTTP headers"
why = "The header \"{name}\" contains a secret ({length} characters) written in the configuration file."
fix = "Use a variable reference (for example \"Bearer ${{TOKEN}}\") or the client's OAuth sign-in. Then rotate the secret."

[rules.G06-004]
title = "Credentials inside the address"
why = "The address contains credentials or a key ({value}). Addresses often end up in server logs and history."
fix = "Remove the key from the address and send it as a header or through OAuth. Then rotate it."

[rules.G07-001]
title = "Access to files with keys or credentials"
why = "The server receives a path to very sensitive files ({path}): SSH keys, cloud credentials, browser data or wallets. If the server is compromised or tricked, it can read and send them out."
fix = "Remove that path from the configuration. Give the server only the working folder it really needs."

[rules.G07-002]
title = "Access to AI agent configurations"
why = "The server receives the path of an MCP configuration ({path}). These files hold keys and commands of other servers: they are the favourite target of tool poisoning attacks."
fix = "An MCP server should not read other servers' configurations. Remove the path."

[rules.G07-003]
title = "Access to .env files"
why = "The server receives a path to a .env file ({path}), which usually holds passwords and keys."
fix = "Check that it is really needed. Otherwise remove the path or move the secrets to a credential manager."

[rules.G08-001]
title = "Access to the whole disk"
why = "The server receives the disk root or the all-users folder as a path ({path}). It can read or change any accessible file."
fix = "Limit the server to the project folders it has to work on."

[rules.G08-002]
title = "Access to your whole personal folder"
why = "The server receives your whole personal folder ({path}), which includes documents, SSH keys and app configurations."
fix = "Give only the folders it needs, for example a single project folder."

[rules.G08-003]
title = "Option that disables protections"
why = "The server is started with the option \"{flag}\", which disables confirmations or protections."
fix = "Remove the option unless you know exactly why it is needed and in which isolated environment it runs."

[rules.G08-004]
title = "Container with elevated privileges or host access"
why = "The server container is started with an option ({option}) that gives it access to the host system. It practically cancels the container isolation."
fix = "Remove the option and mount only the folders you need, read-only if possible (:ro)."

[rules.G08-005]
title = "Container on the host network"
why = "The container uses the PC network directly, so it can reach local services that should stay private."
fix = "Use the container's default network and publish only the ports you need."

[rules.G09-001]
title = "Remote server without encryption"
why = "The connection to \"{host}\" uses http or ws without encryption. Anyone on the same network can read or change the messages, tokens and results included."
fix = "Use the https:// (or wss://) address. If the server does not support it, do not use it on untrusted networks."

[rules.G09-002]
title = "Cloud metadata address"
why = "The address points to {host}, used by cloud services to hand out internal credentials. It is a classic SSRF target."
fix = "Remove the address. An MCP server has no reason to contact cloud metadata."

[rules.G09-003]
title = "Internal network address"
why = "The address points to {host}, a private network. That is fine for your own service, but a malicious server can use it to explore your home or office network."
fix = "Check that the address really is your service. Otherwise remove it."

[rules.G09-004]
title = "Raw IP address"
why = "The address uses a numeric IP ({host}) instead of a domain name: it is harder to tell who it belongs to."
fix = "Prefer the official address with a domain name and https."

[rules.G09-005]
title = "Local server over HTTP"
why = "The server runs on your PC ({host}) over HTTP. Any program, or web page open on the PC, can try to contact it."
fix = "Check that the server requires a token and accepts local connections only. Use the stdio transport if possible."

[rules.G09-006]
title = "Certificate verification disabled"
why = "The setting \"{setting}\" disables HTTPS certificate checks: an attacker on the network can impersonate the server."
fix = "Remove the setting. If you use a corporate certificate, install it in the system instead of disabling checks."

[rules.G09-007]
title = "Tunnel or data collection service"
why = "The address uses {host}, a service often used for temporary tunnels or to collect data sent by others. It is typical of exfiltration."
fix = "Use only official, stable addresses. If you do not know why this address is there, remove the server."

[rules.G09-008]
title = "Deceptively written address"
why = "The name {host} uses international characters (punycode) or an unusual numeric form: it may imitate a well-known site or hide an internal address."
fix = "Check the real address and replace it with the official one."

[rules.G09-009]
title = "Deprecated SSE transport"
why = "The server uses the old HTTP+SSE transport, deprecated by the MCP specification."
fix = "Switch to the Streamable HTTP transport if the server supports it."

[rules.G10-001]
title = "Package without a pinned version"
why = "The package \"{package}\" is downloaded and run without an exact version (given: {version}). If the package is ever tampered with, the new version starts by itself on the next launch."
fix = "Use an exact version you have checked (for example {package}@1.2.3) and update it when you decide."

[rules.G10-002]
title = "Code taken straight from a repository or address"
why = "The server is installed from \"{package}\", a repository or direct address rather than a published version. Its content can change at any time."
fix = "Use a published package with an exact version, or point to a precise commit."

[rules.G10-003]
title = "Name very similar to a well-known package"
why = "The package \"{package}\" has a name almost identical to \"{known}\". This is typosquatting: publishing a package whose name is one letter off."
fix = "Check the exact name on the server's official page. If it was a typo, fix it immediately."

[rules.G10-004]
title = "Unofficial package registry"
why = "The package is downloaded from a registry other than the official one ({registry})."
fix = "Make sure you trust that registry. Otherwise use the official one."

[rules.G10-005]
title = "Container image without a fixed version"
why = "The image \"{image}\" has no fixed version (no tag, or latest): it may change on every start."
fix = "Use an exact tag or, better, the digest (@sha256:...)."

[rules.G11-001]
title = "Server listening on the whole network"
why = "The server accepts connections from the whole network (0.0.0.0), not only from your PC."
fix = "Use 127.0.0.1 to limit access to your computer."

[rules.G12-001]
title = "Incomplete configuration"
why = "The server \"{server}\" has no command or address. It cannot work like this: it may be a leftover or a placeholder."
fix = "Complete the configuration or remove the entry."

[rules.G12-002]
title = "Unknown transport type"
why = "The transport type \"{declared}\" is not one defined by MCP."
fix = "Use stdio, http or sse."

[rules.G12-003]
title = "Same name, different definitions"
why = "The name \"{server}\" is configured in several places with {variants} different definitions. It can be unclear which version you are really using."
fix = "Align the configurations or give different servers different names."

[rules.G12-004]
title = "Duplicate key in the file"
why = "The file contains the key \"{key}\" twice. Different programs may read different values: it is a way to hide a value from whoever reviews the file."
fix = "Keep a single definition and remove the duplicate."

[rules.G12-005]
title = "Plugin pointing outside its folder"
why = "The plugin tries to load a file outside its own folder (\"{reference}\"). Guardia ignored it."
fix = "Review the plugin: a legitimate plugin only uses files inside it."

[rules.G12-006]
title = "Configuration file could not be analyzed"
why = "The file was not read ({reason}), so the servers it contains were not checked."
fix = "Fix the file format or permissions and run the analysis again."

[rules.G01-002]
title = "Hidden instructions for the AI"
why = "The tool \"{tool}\" contains markers such as <IMPORTANT> or HTML comments that you usually do not see, but the AI reads as instructions. This is the classic form of tool poisoning."
fix = "Do not use the server until you have read the flagged text in full. If the instruction is not justified, remove the server and tell its author."

[rules.G01-003]
title = "Asks the AI to act covertly"
why = "The text of \"{tool}\" asks not to inform the user or to do something silently. An honest tool has no reason to hide its actions."
fix = "Remove the server: this is a typical sign of malicious tools."

[rules.G01-004]
title = "Invisible text hidden with Unicode tag characters"
why = "The field \"{field}\" of \"{tool}\" contains invisible characters that decode to: \"{decoded}\". The AI can read them, you cannot."
fix = "Remove the server immediately: this technique only exists to hide instructions."

[rules.G01-005]
title = "Hidden encoded text"
why = "The field \"{field}\" of \"{tool}\" contains an encoded block (base64 or hex) that decodes to readable text: \"{decoded}\". Text hidden this way may carry instructions for the AI."
fix = "Check the decoded content. If there is no obvious technical reason for it, remove the server."

[rules.G01-006]
title = "Text pushed off screen"
why = "The field \"{field}\" of \"{tool}\" contains a huge amount of spaces or blank lines, or is extremely long ({length} characters). This is a trick to hide instructions beyond the visible part."
fix = "Read the full text (for example in the JSON report) and check what is at the end."

[rules.G02-001]
title = "Attempt to override the AI's instructions"
why = "The text of \"{tool}\" contains a typical prompt injection phrase, such as \"ignore previous instructions\". It is meant to change how the AI behaves."
fix = "Remove the server or have the author fix the text."

[rules.G02-002]
title = "Fake conversation delimiters"
why = "The text of \"{tool}\" imitates the internal separators of a conversation with the AI (for example \"System:\" or result tags). It is meant to make the AI believe the text comes from you or the system."
fix = "Remove the server: legitimate text does not need to imitate these delimiters."

[rules.G02-003]
title = "Asks to hand over the conversation"
why = "The text of \"{tool}\" asks the AI to include the conversation, previous messages or system instructions. That way your data ends up at the server."
fix = "Remove the server, or ask the author why they need it."

[rules.G02-004]
title = "Orders preliminary actions"
why = "The text of \"{tool}\" tells the AI to read, run or call something before using the tool. Sometimes this is legitimate, but it is also how attacks get unrequested actions done."
fix = "Read the text: if the requested action has nothing to do with the tool, do not use it."

[rules.G03-001]
title = "Tool changed since the last analysis"
why = "The description or parameters of \"{tool}\" changed compared to the last approved analysis. This is the sign of a possible rug pull: an approved server that changes covertly."
fix = "Check what changed. If the change is legitimate (for example an update), accept it with: guardia scan --accept-changes"

[rules.G03-002]
title = "New tool"
why = "The server added the tool \"{tool}\" since the last analysis."
fix = "Check that the new tool is expected. It has already been added to the baseline."

[rules.G03-003]
title = "Server configuration changed"
why = "The command, arguments or variables of \"{server}\" changed compared to the last approved analysis."
fix = "If you made the change, accept it with: guardia scan --accept-changes. Otherwise find out who changed the file."

[rules.G03-004]
title = "Tool disappeared"
why = "The tool \"{tool}\" is no longer present compared to the last analysis."
fix = "This is usually a normal update. Accept it with: guardia scan --accept-changes"

[rules.G03-005]
title = "Damaged baseline"
why = "The baseline file ({path}) is unreadable or was changed outside Guardia. While this lasts, rug pulls cannot be detected."
fix = "If you do not know why it changed, check your PC. To recreate it: guardia scan --accept-changes"

[rules.G03-006]
title = "New server"
why = "The server \"{server}\" was not there in the last analysis."
fix = "Check that you added it yourself. It has already been added to the baseline."

[rules.G04-001]
title = "Instructions about other tools (shadowing)"
why = "The text of \"{tool}\" gives instructions on how to use other tools or servers. That way a malicious server can manipulate trusted servers without touching them."
fix = "Remove the server: a tool should only describe itself."

[rules.G04-002]
title = "Mentions a tool of another server"
why = "The text of \"{tool}\" mentions \"{mentioned}\", a tool of another server ({other}). This may be a sign of shadowing."
fix = "Check why it mentions it. If it gives instructions about that tool, do not use the server."

[rules.G04-003]
title = "Same name as a tool of another server"
why = "The tool \"{tool}\" has the same name as a tool of {other}. The AI might call the wrong one."
fix = "Disable one of the two servers if you do not need both."

[rules.G04-004]
title = "Imitates a built-in client tool"
why = "The tool is called \"{tool}\", like a built-in Claude Code tool. It can confuse the AI or whoever approves calls."
fix = "Review the server: a legitimate tool uses its own name."

[rules.G04-005]
title = "Changes message recipients"
why = "The text of \"{tool}\" asks to change or add recipients (email, phone, blind copy). This is how messages get diverted to an attacker."
fix = "Remove the server."

[rules.G04-006]
title = "Look-alike (homoglyph) name"
why = "The tool \"{tool}\" uses letters from another alphabet that look like Latin ones ({scripts}); read as ordinary letters its name is \"{skeleton}\". This is a homoglyph trick: a name made to look trusted so it slips past the AI or whoever approves calls."
fix = "Do not use the server: a legitimate tool names itself with ordinary letters."

[rules.G04-007]
title = "Look-alike (homoglyph) server name"
why = "The server \"{server}\" is named with letters from another alphabet that look like Latin ones ({scripts}); read as ordinary letters its name is \"{skeleton}\". This is a homoglyph trick: a name made to look like a server you trust."
fix = "Rename the server with ordinary letters, or remove it if you did not add it yourself."

[rules.G05-008]
title = "Tool that can run commands or code"
why = "The tool \"{tool}\" can run commands or code on your PC. That is not a problem in itself, but it is the most powerful tool the AI has: if the AI is tricked, this is where the damage happens."
fix = "Keep manual confirmation on for this tool and do not approve calls you do not understand."

[rules.G06-005]
title = "Asks the AI to send secrets"
why = "The text of \"{tool}\" asks to send keys, tokens, passwords or cookies."
fix = "Remove the server and rotate any secret it may have received."

[rules.G06-006]
title = "Asks for a secret as a parameter"
why = "The tool \"{tool}\" has a \"{parameter}\" parameter: the AI will have to handle a secret and may show it or pass it elsewhere."
fix = "Prefer servers that read secrets from environment variables or through OAuth."

[rules.G07-004]
title = "Asks to read or send sensitive files"
why = "The text of \"{tool}\" asks the AI to read or send very sensitive files (SSH keys, .env, MCP configurations, wallets). This is the core of tool poisoning attacks."
fix = "Remove the server immediately and check whether you already used it. If you did, rotate the keys involved."

[rules.G08-006]
title = "Misleading annotations"
why = "The tool \"{tool}\" declares itself harmless ({hint}), but its name suggests it changes or deletes something. Some clients trust these annotations and skip confirmation."
fix = "Do not trust the annotation: keep manual confirmation for this tool."

[rules.G09-010]
title = "Asks to send data to a web address"
why = "The text of \"{tool}\" asks the AI to send data to a web address or a webhook."
fix = "Remove the server, unless sending is the clear, declared purpose of the tool."

[rules.G12-007]
title = "Part of the server code was not analyzed"
why = "{count} files of the server \"{server}\" were not analyzed: too large, unreadable or written so they cannot be parsed. A crafted file can be used to hide tools."
fix = "Check the files listed in the JSON report. If the server comes from an official source, this is usually harmless."

[capability]
process = "start programs"
network = "use the network"
file_read = "read files"

[rules.G05-009]
title = "Runs hidden code decoded on the fly"
why = "The code of \"{server}\" decodes a text (for example from base64) and runs it immediately ({found}). This is the typical signature of malware in packages: the real code stays invisible to whoever reads it."
fix = "Do not use the server. If it is a public package, report it to the registry (npm or PyPI) and to the author."

[rules.G05-010]
title = "Shell command built from variable text"
why = "The code of \"{server}\" runs shell commands built by joining variable text ({found}; {count} places). If that text comes from the AI or from a file, someone could add commands (command injection)."
fix = "This is a hint for the server's developers: pass arguments as a list, without a shell. For you: keep manual confirmation on calls to this server."

[rules.G05-011]
title = "Dynamic code execution"
why = "The code of \"{server}\" runs code built at runtime ({found}; {count} places). Some libraries do this, but it makes it impossible to know in advance what will run."
fix = "In well-known libraries this is usually harmless. If the server is little known, check the location shown."

[rules.G06-007]
title = "Secret written in the code"
why = "The code of \"{server}\" contains what looks like a secret ({found}). Anyone who has the package can read and use it."
fix = "If the server is yours, move the secret to an environment variable and rotate it. If it is not yours, tell the author."

[rules.G06-008]
title = "The code packs all environment variables"
why = "The code of \"{server}\" turns all environment variables into text ({found}). They usually hold keys and tokens: this is a typical step before sending them elsewhere."
fix = "Check where that text goes. If it is sent over the network, do not use the server."

[rules.G07-005]
title = "The code uses paths of credential files"
why = "The code of \"{server}\" contains the path of very sensitive files ({found}). If the same file also uses the network the level is CRITICAL, because it could read and send them."
fix = "Check why the server needs it. A normal MCP server does not read SSH keys, cloud credentials or browser data."

[rules.G07-006]
title = "The code reads or changes AI agent configurations"
why = "The code of \"{server}\" uses AI agent configuration files ({detail}) in {count} places ({files}). These are often scripts that add the server to the configuration, but the same access allows reading other servers' keys."
fix = "Check that this is an install or uninstall script. If the server touches these configurations while working, do not use it."

[rules.G09-011]
title = "The code contacts a tunnel or data collection service"
why = "The code of \"{server}\" contains the address of a service often used for temporary tunnels or to collect data ({detail})."
fix = "A trustworthy server uses its own stable addresses. If you do not know why it is there, do not use the server."

[rules.G09-012]
title = "The code contacts a raw IP address"
why = "The code of \"{server}\" contains a hard-coded public IP address ({found}): it is harder to tell who it belongs to."
fix = "Check who owns the address."

[rules.G10-006]
title = "Scripts that run automatically at install time"
why = "The server \"{server}\" and its dependencies contain {count} scripts that run by themselves during installation, for example: {found}. They run before you use the server, with your permissions. The level rises to HIGH if a script downloads or runs code from the Internet."
fix = "Review the scripts shown. To install without running them: npm install --ignore-scripts (some packages may not work)."

[rules.G10-007]
title = "Dependency taken from a repository or address"
why = "The server \"{server}\" depends on code taken straight from a repository or address ({found}) rather than a published version. Its content can change without notice."
fix = "Ask the author to use published versions or to pin a precise commit."

[rules.G10-008]
title = "Dependency name almost identical to a famous package"
why = "The server \"{server}\" uses the package \"{found}\", one letter away from \"{detail}\". This is typosquatting."
fix = "Check that it really is the intended package. If it is a typo, malicious code may have been installed."

[rules.G10-009]
title = "Dependency without a version"
why = "The server \"{server}\" declares dependencies with no version at all ({found}; {count} in total): every installation may bring different code."
fix = "Use exact versions or a lockfile (package-lock.json, uv.lock)."

[rules.G10-010]
title = "setup.py runs code at install time"
why = "The setup.py file of \"{server}\" uses: {detail}. This code runs while the package is installed, before you can check it."
fix = "Review setup.py. A modern package should not start programs or use the network during installation."

[rules.G10-011]
title = "No lockfile"
why = "The project in {found} has no lockfile (for example package-lock.json or uv.lock): dependency versions may change on every installation."
fix = "Create and keep a lockfile: npm install creates package-lock.json, uv lock creates uv.lock."

[skills]
title = "Installed skills: {count}"
flagged = "Skills with findings:"
clean = "No known problems ({count}): {names}"
none = "No skills found."
field = "skill \"{tool}\", {field}"

[rules.G14-001]
title = "The skill contains executable scripts"
why = "The skill \"{server}\" contains {count} scripts ({files}) that the AI can run on your PC when it uses the skill."
fix = "Read the scripts before using the skill, especially if it comes from a source you do not know."

[rules.G14-002]
title = "The skill grants itself powerful tools without confirmation"
why = "The header of the skill \"{server}\" allows {detail} without asking for confirmation each time (allowed-tools field). If the skill instructions are manipulated, commands run without your approval."
fix = "Remove or narrow allowed-tools (for example Bash(git status:*)) unless you fully trust the skill."

[rules.G14-003]
title = "The skill downloads and runs code from the Internet"
why = "The skill \"{server}\" contains a command that downloads a script from the Internet and runs it immediately ({found}). Whoever controls that address can run anything on your PC. In the skill instructions this is MEDIUM, because the AI asks for confirmation; in an attached script it is HIGH."
fix = "Install the program from the official site after checking its origin, instead of running a script downloaded on the fly."

