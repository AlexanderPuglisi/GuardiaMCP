[rules.G13-001]
title = "Registro manomesso"
why = "Il registro a prova di manomissione ({path}) non supera la verifica: {problems}. Qualcuno o qualcosa ha modificato, cancellato o aggiunto righe fuori da Guardia."
fix = "Non cancellarlo: è la prova dell'accaduto. Controlla il PC, poi esegui: guardia registro verifica"

[rules.G13-002]
title = "Registro non verificabile"
why = "Il registro ({path}) non può essere verificato del tutto: {problems}."
fix = "Se hai cambiato utente di Windows o ripristinato il PC è normale. Altrimenti controlla chi ha modificato la cartella di Guardia."

