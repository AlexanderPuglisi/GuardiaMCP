[rules.G14-001]
title = "La skill contiene script eseguibili"
why = "La skill «{server}» contiene {count} script ({files}) che l'AI può eseguire sul tuo PC quando usa la skill."
fix = "Leggi gli script prima di usare la skill, soprattutto se viene da una fonte che non conosci."

[rules.G14-002]
title = "La skill si concede strumenti potenti senza conferma"
why = "L'intestazione della skill «{server}» autorizza {detail} senza chiedere conferma ogni volta (campo allowed-tools). Se le istruzioni della skill vengono manipolate, i comandi partono senza che tu li approvi."
fix = "Rimuovi o restringi allowed-tools (per esempio Bash(git status:*)) se non ti fidi completamente della skill."

[rules.G14-003]
title = "La skill scarica ed esegue codice da Internet"
why = "La skill «{server}» contiene un comando che scarica uno script da Internet e lo esegue subito ({found}). Chi controlla quell'indirizzo può eseguire qualsiasi cosa sul tuo PC. Nelle istruzioni della skill è MEDIO, perché l'AI ti chiede conferma; in uno script allegato è ALTO."
fix = "Installa il programma dal sito ufficiale verificandone la provenienza, invece di eseguire uno script scaricato al volo."

