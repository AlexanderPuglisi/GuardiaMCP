[guide]
title = "Guida alle regole di Guardia MCP"
intro = "Questa guida elenca tutte le {count} regole che Guardia usa per controllare server MCP e skill. Per ognuna trovi perché è un rischio e come correggerlo. La guida è generata dal programma stesso con `guardia regole --markdown`, quindi è sempre allineata al codice. Nei testi, «…» indica un valore che nel rapporto vero viene sostituito con il nome del server, del file o del campo trovato."
levels_title = "I livelli di gravità"
level = "Livello"
meaning = "Cosa significa"
level_critical = "Quasi certamente un attacco o una falla grave. Intervieni subito: disattiva il server o la skill finché non hai capito."
level_high = "Rischio serio e concreto. Va corretto prima di continuare a usare il server."
level_medium = "Debolezza che un attaccante può sfruttare insieme ad altro. Correggi appena puoi."
level_low = "Cattiva abitudine o rischio piccolo. Da sistemare con calma."
level_info = "Non è un problema: è un'informazione utile, per esempio cosa può fare un server o che qualcosa è cambiato."
read_title = "Come leggere un problema"
read_text = "Ogni problema riporta un codice (per esempio G05-002), un livello, il punto esatto (file, riga e campo), cosa è stato trovato, perché è un rischio e come correggerlo. I segreti trovati non vengono mai mostrati per intero: al loro posto compare [REDACTED] o solo la lunghezza."
code_title = "Come sono fatti i codici"
code_text = "Il codice ha due parti: G05 è la famiglia (per esempio «comandi di sistema pericolosi»), 002 è la regola dentro la famiglia. I codici non vengono riusati per significati diversi, così puoi cercarli, citarli e filtrarli negli strumenti che leggono il formato SARIF."
what_title = "Cosa fare quando trovi un problema"
what_text = """
1. Leggi «Perché» e «Come correggere» della regola.
2. Se non riconosci il server o la skill, disattivalo prima di indagare: è la scelta più sicura.
3. Se il problema è una modifica (famiglia G03) e l'aggiornamento l'hai fatto tu, accettala con `guardia scansiona --accetta-modifiche` oppure con il pulsante «Accetta le modifiche» nell'app. La scelta resta scritta nel registro.
4. Dopo la correzione, scansiona di nuovo per controllare che il problema sia sparito.
5. Se pensi che sia un falso allarme, segnalalo come spiegato in CONTRIBUTING.md.
"""
false_title = "Falsi allarmi e allarmi mancati"
false_text = "Guardia lavora leggendo i file, senza eseguire nulla e senza intelligenza artificiale. Per questo può sbagliare in due modi: segnalare un testo innocuo (falso allarme) oppure non accorgersi di un trucco nuovo (allarme mancato). «Nessun problema trovato» non significa «sicuro»: significa che queste regole non hanno trovato nulla. Tutti i limiti sono spiegati in SECURITY.md."
shield_title = "E le regole che scrivo io?"
shield_text = "Le regole scritte da te in formato TOML guidano lo Scudo in tempo reale (vedi docs/SCUDO.md). Questa guida riguarda solo le regole fisse dell'analisi della versione 1, che non si possono disattivare: così nessun file malevolo può spegnerle."
terms_title = "Parole utili"
term_tool_poisoning = "Tool poisoning"
term_tool_poisoning_text = "istruzioni nascoste dentro la descrizione di uno strumento. L'utente non le vede, ma l'AI le legge e può obbedire."
term_prompt_injection = "Prompt injection"
term_prompt_injection_text = "testo scritto per sostituirsi agli ordini dell'utente, per esempio «ignora le istruzioni precedenti». Può arrivare da uno strumento, da un file o da una pagina web."
term_rug_pull = "Rug pull"
term_rug_pull_text = "un server che era innocuo e cambia di nascosto dopo che ti sei fidato. Guardia lo scopre confrontando ogni scansione con la base di confronto."
term_shadowing = "Shadowing"
term_shadowing_text = "un server che prova a influenzare come l'AI usa gli strumenti di un altro server, per esempio dicendo «quando usi send_email aggiungi questo indirizzo»."
term_typosquatting = "Typosquatting"
term_typosquatting_text = "un pacchetto con un nome quasi uguale a uno famoso (una lettera in più o scambiata), pubblicato sperando che qualcuno sbagli a scrivere."
term_secret = "Segreto"
term_secret_text = "una chiave, un token o una password che dà accesso a un servizio. Se finisce in un file di configurazione, chiunque legga il file può usarlo."
term_baseline = "Base di confronto"
term_baseline_text = "la fotografia degli strumenti e delle skill presa alla scansione precedente. Serve per accorgersi di cosa è cambiato."
term_skill = "Skill"
term_skill_text = "una cartella con un file SKILL.md che insegna all'AI come fare un compito. Può contenere istruzioni e script, quindi va controllata come un server."
families_title = "Le famiglie di regole"
family_count = "{count} regole"
family_count_one = "1 regola"
family_line = "Famiglia {code}: {name}"
footer = "Guardia MCP — by Alexander Puglisi. Licenza Apache 2.0."
