# Guardia MCP Shield rules.
# Each [[rule]] says what to do when a message matches its conditions.
# When several rules match, the strictest wins: block > ask > redact > log > allow.
# After every change: "Save and approve" in the Shield section of the app, or: guardia shield rules approve
# Full guide: docs/SHIELD.md

version = 1

# What to do when no rule matches: allow, log, ask or block.
default = "allow"

# 1. Blocks every call that asks to read or write these files: SSH keys, cloud credentials,
#    certificates and .env files with passwords.
[[rule]]
name = "Never touch SSH keys, credentials and .env files"
action = "block"
phase = "call"
argument.path = [
  "~/.ssh/**",
  "**/.ssh/**",
  "**/.env",
  "**/*.pem",
  "**/id_rsa*",
  "~/.aws/**",
  "**/.git-credentials",
]

# 2. Blocks calls that send data to services often used to smuggle information out
#    (public tunnels and request collectors).
[[rule]]
name = "Do not send data to tunnel or collection services"
action = "block"
phase = "call"
argument.host = [
  "*.ngrok.io",
  "*.ngrok-free.app",
  "*.trycloudflare.com",
  "webhook.site",
  "*.requestbin.net",
  "*.m.pipedream.net",
]

# 3. If a result contains a key or a password, the AI receives it covered with asterisks.
[[rule]]
name = "Redact secrets in results"
action = "redact"
phase = "result"
content.secrets = true

# 4. Hides from the AI the tools whose description tries to give it orders.
[[rule]]
name = "Hide tools that give orders to the AI"
action = "block"
phase = "list"
content.contains = [
  "ignore previous instructions",
  "ignora le istruzioni precedenti",
  "do not tell the user",
  "non dirlo all'utente",
]

# 5. Stops a server that calls tools in bursts: beyond 30 calls a minute, the rest are blocked.
[[rule]]
name = "At most 30 calls per minute per server"
action = "block"
phase = "call"
method = "tools/call"
rate = { max = 30, seconds = 60 }

