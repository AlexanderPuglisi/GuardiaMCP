# Regole dello Scudo di Guardia MCP.
# Ogni [[regola]] dice cosa fare quando un messaggio corrisponde alle sue condizioni.
# Se più regole corrispondono, vince la più severa: blocca > chiedi > oscura > registra > consenti.
# Dopo ogni modifica: «Salva e approva» nella sezione Scudo dell'app, oppure: guardia scudo regole approva
# Guida completa: docs/SCUDO.md

versione = 1

# Cosa fare quando nessuna regola corrisponde: consenti, registra, chiedi o blocca.
predefinito = "consenti"

# 1. Blocca ogni chiamata che chiede di leggere o scrivere questi file: chiavi SSH,
#    credenziali del cloud, certificati e file .env con le password.
[[regola]]
nome = "Mai toccare chiavi SSH, credenziali e file .env"
azione = "blocca"
fase = "chiamata"
argomento.percorso = [
  "~/.ssh/**",
  "**/.ssh/**",
  "**/.env",
  "**/*.pem",
  "**/id_rsa*",
  "~/.aws/**",
  "**/.git-credentials",
]

# 2. Blocca le chiamate che mandano dati a servizi usati spesso per portare fuori informazioni
#    (tunnel pubblici e raccoglitori di richieste).
[[regola]]
nome = "Non inviare dati a servizi di tunnel o raccolta"
azione = "blocca"
fase = "chiamata"
argomento.host = [
  "*.ngrok.io",
  "*.ngrok-free.app",
  "*.trycloudflare.com",
  "webhook.site",
  "*.requestbin.net",
  "*.m.pipedream.net",
]

# 3. Se un risultato contiene una chiave o una password, l'AI la riceve coperta da asterischi.
[[regola]]
nome = "Oscura i segreti nei risultati"
azione = "oscura"
fase = "risultato"
contenuto.segreti = true

# 4. Nasconde all'AI gli strumenti la cui descrizione prova a darle ordini.
[[regola]]
nome = "Nascondi gli strumenti che danno ordini all'AI"
azione = "blocca"
fase = "elenco"
contenuto.contiene = [
  "ignore previous instructions",
  "ignora le istruzioni precedenti",
  "do not tell the user",
  "non dirlo all'utente",
]

# 5. Ferma un server che chiama strumenti a raffica: oltre 30 chiamate al minuto, le altre sono bloccate.
[[regola]]
nome = "Al massimo 30 chiamate al minuto per server"
azione = "blocca"
fase = "chiamata"
metodo = "tools/call"
frequenza = { massimo = 30, secondi = 60 }

# Esempio da adattare: togli i # davanti alle righe per attivarlo.
# Prima di creare, cancellare, inviare o unire qualcosa su GitHub, Guardia ti chiede conferma.
# [[regola]]
# nome = "GitHub: chiedi prima di scrivere"
# server = "github"
# strumento = ["create_*", "delete_*", "push_*", "merge_*"]
# azione = "chiedi"
