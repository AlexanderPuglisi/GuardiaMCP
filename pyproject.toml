[project]
name = "guardia-mcp"
version = "0.1.0"
description = "Defensive shield for AI agents that use the Model Context Protocol (MCP). By Alexander Puglisi."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexander Puglisi" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["mcp", "model-context-protocol", "security", "ai-agents", "scanner", "tool-poisoning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
guardia = "guardia.cli:main"

[project.gui-scripts]
guardia-app = "guardia.app.main:main"

[project.optional-dependencies]
app = [
    "pywebview>=5.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "guardia"

[dependency-groups]
build = [
    "pillow==13.0.0",
    "pyinstaller==6.22.3",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N", "C4", "PIE", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S603"]
"src/guardia/extract/**" = ["PLR0911", "PLR0912"]
"src/guardia/model.py" = ["S105"]
"src/guardia/render/html.py" = ["E501"]
"src/guardia/app/main.py" = ["PLC0415"]
"src/guardia/app/confirm.py" = ["PLC0415"]
"src/guardia/cli.py" = ["PLC0415"]
"scripts/demo.py" = ["S603"]
"src/guardia/shield/process.py" = ["S603"]
"tests/test_shield_rules.py" = ["E501"]
"tests/test_shield_protections.py" = ["E501"]
"tests/test_shield_activation.py" = ["E501"]
"tests/test_shield_confirm.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
exclude = ["tests/corpus/"]

[[tool.mypy.overrides]]
module = ["PyInstaller", "PyInstaller.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
